name: 模型校准或功能建议
description: 提交参数、校准依据或实验工作流建议。
title: '[建议] '
body:
  - type: textarea
    id: scenario
    attributes:
      label: 实验场景或建议
      description: 请说明光纤、薄膜结构、温度边界和想解决的问题。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 参数与依据
      description: 请标明数值、单位、文献或可公开的实验依据，并区分实测和仿真数据。
  - type: textarea
    id: expectation
    attributes:
      label: 预期改进
